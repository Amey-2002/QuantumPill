<!DOCTYPE html>
<html>
<head>
    <title>Quantum Outreach Game</title>
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; text-align: center; }
        canvas { border: 2px solid #4e4e91; background: #0f3460; border-radius: 8px; cursor: crosshair; }
        .ui { margin-top: 20px; max-width: 600px; margin-left: auto; margin-right: auto; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #e94560; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Project: Quantum Splitter</h1>
    <div class="ui">
        <p id="instruction">Click <b>"Fire Photon"</b> to start the experiment.</p>
        <button onclick="firePhoton()">Fire Photon</button>
    </div>
    <br>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('instruction');

        let state = "IDLE"; // IDLE, MOVING, SUPERPOSITION, MEASURED
        let photonX = 50;
        let photonY = 200;
        let probability = 0; // Visual "glow" for superposition

        function firePhoton() {
            if (state !== "IDLE") return;
            state = "MOVING";
            photonX = 50;
            statusText.innerText = "The photon is traveling as a single particle...";
        }

        canvas.addEventListener('mousedown', () => {
            if (state === "SUPERPOSITION") {
                // COLLAPSE THE WAVEFUNCTION
                state = "MEASURED";
                // 50/50 chance to appear in Top or Bottom path
                photonY = Math.random() > 0.5 ? 100 : 300;
                statusText.innerText = "OBSERVED! The superposition collapsed to one path.";
                setTimeout(() => { state = "IDLE"; photonX = 50; photonY = 200; }, 2000);
            }
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Beam Splitter (The "Quantum Gate")
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(250, 150);
            ctx.lineTo(350, 250);
            ctx.stroke();
            ctx.fillText("BEAM SPLITTER (H-GATE)", 240, 140);

            // Draw Detectors
            ctx.fillStyle = "#4e4e91";
            ctx.fillRect(500, 75, 50, 50); // Top Detector
            ctx.fillRect(500, 275, 50, 50); // Bottom Detector
            ctx.fillStyle = "white";
            ctx.fillText("DETECTOR A", 500, 70);
            ctx.fillText("DETECTOR B", 500, 270);

            if (state === "MOVING") {
                photonX += 3;
                drawPhoton(photonX, photonY, 1);
                if (photonX >= 300) state = "SUPERPOSITION";
            } 
            
            else if (state === "SUPERPOSITION") {
                photonX += 3;
                if (photonX > 480) photonX = 480; // Stop at detectors
                // Draw two ghostly paths
                drawPhoton(photonX, 100, 0.4); 
                drawPhoton(photonX, 300, 0.4);
                statusText.innerHTML = "<b>SUPERPOSITION!</b> The photon is in both paths. <br> CLICK THE CANVAS TO OBSERVE IT!";
            }

            else if (state === "MEASURED") {
                drawPhoton(photonX, photonY, 1);
            }

            requestAnimationFrame(draw);
        }

        function drawPhoton(x, y, alpha) {
            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 255, 255, ${alpha})`;
            ctx.shadowBlur = 15;
            ctx.shadowColor = "cyan";
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        draw();
    </script>
</body>
</html>
